<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bloom launch film</title>
<style>
@font-face { font-family: Geist; src: url(assets/Geist-Regular.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: Geist; src: url(assets/Geist-Medium.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: Geist; src: url(assets/Geist-SemiBold.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: GeistMono; src: url(assets/GeistMono-Regular.woff2) format("woff2"); font-weight: 400; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #060608; }
body { font-family: Geist, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
.center { display: grid; place-items: center; }
.line { font-size: 84px; font-weight: 500; letter-spacing: -0.02em; white-space: nowrap; }
.line span { display: inline-block; margin-right: 0.24em; }
.line span:last-child { margin-right: 0; }

/* The window: a real page, rounded, soft neutral shadow, nothing drawn on top. */
.stage { position: absolute; left: 240px; top: 135px; width: 1440px; height: 810px; perspective: 2200px; }
.win { position: absolute; inset: 0; border-radius: 16px; overflow: hidden; background: #05060f;
  box-shadow: 0 22px 90px rgba(0, 0, 0, 0.34); transform-origin: 50% 50%; }
.win canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* Vela landing page inside window one. */
.vela-nav { position: absolute; top: 0; left: 0; right: 0; height: 88px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; }
.vela-nav img { height: 30px; display: block; }
.vela-links { display: flex; gap: 36px; align-items: center; font-size: 17px; color: #c9ccd6; }
.vela-btn { background: #ff4f1a; color: #fff; border-radius: 10px; padding: 12px 18px; font-weight: 500; }
.vela-hero { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; align-items: center; text-align: left; }
.vela-hero h1 { margin: 0; font-size: 92px; font-weight: 500; letter-spacing: -0.035em; line-height: 1; }
.vela-hero p { margin: 22px 0 0; font-size: 24px; color: #c9ccd6; }

.shot img.sheet { position: absolute; left: 0; top: 0; width: 1440px; display: block; }

.cut { position: absolute; inset: 0; }
.cut canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#cutSail { background: #ff4f1a; }
#cutSail img { width: 330px; }
#cutWord img { width: 1100px; }

#logo svg { width: 900px; height: auto; overflow: visible; }
#end svg { width: 640px; height: auto; }
#url { font-family: GeistMono, monospace; font-size: 30px; color: #a3a9b8; margin-top: 44px; text-align: center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="mb" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur id="mbBlur" stdDeviation="0 0" /></filter>
</svg>

<div id="L1" class="layer center"><div class="line">You have an idea.</div></div>
<div id="L2" class="layer center"><div class="line">Bloom does the rest.</div></div>
<div id="logo" class="layer center"></div>
<div id="L3" class="layer center"><div class="line">Art for your site.</div></div>

<div id="W1" class="layer">
  <div class="stage"><div class="win" id="win1">
    <canvas id="funnel"></canvas>
    <div class="vela-nav"><img src="assets/logo-horizontal-reverse.svg" alt="" />
      <div class="vela-links"><span>Rideshare</span><span>Vehicle</span><span>Schedule</span><span class="vela-btn">Book a launch</span></div></div>
    <div class="vela-hero"><div><h1>Launch<br />every week.</h1><p>Reusable launch for small satellites.</p></div></div>
  </div></div>
</div>

<div id="L4" class="layer center"><div class="line">A logo for your name.</div></div>

<div id="W2" class="layer">
  <div class="stage"><div class="win shot" id="win2" style="background:#f4f4f2">
    <img class="sheet" id="options" src="assets/options.webp" alt="" />
    <img class="sheet" id="board" src="assets/board.webp" alt="" style="opacity:0" />
  </div></div>
</div>

<div id="L5" class="layer center"><div class="line">A film for launch day.</div></div>

<div id="C0" class="layer cut"><canvas id="rocket"></canvas></div>
<div id="C1" class="layer cut"><div id="cutSail" class="cut center"><img src="assets/symbol-white.svg" alt="" /></div></div>
<div id="C2" class="layer center"><div class="line">Small satellites, every week.</div></div>
<div id="C3" class="layer cut"><canvas id="eclipse"></canvas></div>
<div id="C4" class="layer center"><div id="cutWord" class="center"><img src="assets/wordmark-reverse.svg" alt="" /></div></div>

<div id="L6" class="layer center"><div class="line">Bloom your idea into success.</div></div>
<div id="end" class="layer center"><div><div id="endLogo"></div><div id="url">github.com/edison16a/bloom</div></div></div>

<script type="module" src="dist/film.js"></script>
</body>
</html>
